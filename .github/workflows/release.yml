name: Release

# Fully automatic: on every push to main, read the version from Tjommie.toc.
# If there's no tag for that version yet, run the tests, create the tag and publish:
#   - GitHub Release with Tjommie-vX.Y.Z.zip
#   - CurseForge (## X-Curse-Project-ID in the TOC + CF_API_KEY secret)
#   - Wago (## X-Wago-ID + WAGO_API_TOKEN secret), once set up
# Pushes that don't bump the version do nothing here.
# Can also be started by hand from the Actions tab (Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from the TOC
        id: version
        run: |
          VERSION=$(grep -m1 '^## Version:' Tjommie.toc | sed 's/## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VERSION - releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.version.outputs.release == 'true'
        with:
          python-version: "3.12"

      - name: Run tests before releasing
        if: steps.version.outputs.release == 'true'
        run: |
          pip install lupa luaparser
          python3 tests/run_tests.py

      - name: Create the version tag
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Package and upload
        if: steps.version.outputs.release == 'true'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
